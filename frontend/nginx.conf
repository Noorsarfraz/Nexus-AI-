server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route that isn't a real static file falls back to
    # index.html so React Router can handle it client-side (mirrors the
    # Vercel/Netlify SPA rewrite rule described in the README).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
