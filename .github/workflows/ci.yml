name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (Jest + Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend test suite
        run: npm test
        env:
          # api.test.js spins up its own in-memory MongoDB instance and
          # overwrites this before requiring server.js, but JWT_SECRET is
          # read at module-load time, so it must exist up front too.
          JWT_SECRET: ci_test_secret_do_not_use_in_prod

  frontend-tests:
    name: Frontend (Vitest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit/component test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
